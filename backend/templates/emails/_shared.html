<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{emailTitle}}</title>
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }
    
    /* Base Styles */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
      background-color: #f4f4f4;
    }
    
    /* Container */
    .email-wrapper {
      width: 100%;
      background-color: #f4f4f4;
      padding: 40px 0;
    }
    
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    
    /* Header */
    .email-header {
      background: #ffffff;
      padding: 28px 40px;
      text-align: center;
      border-bottom: 2px solid #f3f4f6;
    }
    
    .email-logo {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    
    /* Light in Motion Effect - Subtle Accent */
    .light-accent {
      height: 3px;
      background: linear-gradient(90deg, 
        rgba(244, 119, 33, 0) 0%,
        rgba(244, 119, 33, 0.4) 30%,
        rgba(244, 119, 33, 0.8) 50%,
        rgba(244, 119, 33, 0.4) 70%,
        rgba(244, 119, 33, 0) 100%
      );
    }
    
    /* Content */
    .email-content {
      padding: 40px;
    }
    
    .email-heading {
      margin: 0 0 24px 0;
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.3;
    }
    
    .email-message {
      margin: 0 0 24px 0;
      font-size: 15px;
      color: #4b5563;
      line-height: 1.7;
    }
    
    /* Dynamic Content Section */
    .email-details {
      background-color: #f9fafb;
      border-left: 3px solid #F47721;
      padding: 20px;
      margin: 24px 0;
      border-radius: 4px;
    }
    
    .detail-row {
      margin: 8px 0;
      font-size: 14px;
      color: #374151;
    }
    
    .detail-label {
      font-weight: 600;
      color: #1a1a1a;
      display: inline-block;
      min-width: 120px;
    }
    
    .detail-value {
      color: #4b5563;
    }
    
    /* Status Messages */
    .status-box {
      padding: 16px 20px;
      border-radius: 6px;
      margin: 24px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .status-success {
      background-color: #d1fae5;
      border-left: 4px solid #10b981;
      color: #065f46;
    }
    
    .status-warning {
      background-color: #fef3c7;
      border-left: 4px solid #f59e0b;
      color: #78350f;
    }
    
    .status-error {
      background-color: #fee2e2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
    }
    
    .status-info {
      background-color: #e0f2fe;
      border-left: 4px solid #0ea5e9;
      color: #075985;
    }
    
    /* Primary Button */
    .button-wrapper {
      text-align: center;
      margin: 32px 0;
    }
    
    .button-primary {
      display: inline-block;
      padding: 14px 32px;
      background: #F47721;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s;
      box-shadow: 0 2px 4px rgba(244, 119, 33, 0.2);
    }
    
    .button-primary:hover {
      background: #E74632;
      box-shadow: 0 4px 8px rgba(244, 119, 33, 0.3);
    }
    
    /* Supporting Text */
    .supporting-text {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.6;
      margin: 16px 0;
    }
    
    .text-url {
      word-break: break-all;
      background-color: #f9fafb;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: #6b7280;
      margin: 12px 0;
    }
    
    /* Divider */
    .divider {
      height: 1px;
      background-color: #e5e7eb;
      margin: 32px 0;
    }
    
    /* Footer */
    .email-footer {
      background-color: #f9fafb;
      padding: 32px 40px;
      text-align: center;
      border-top: 2px solid #f3f4f6;
    }
    
    .footer-brand {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 16px;
    }
    
    .footer-links {
      margin: 16px 0;
    }
    
    .footer-link {
      color: #4b5563;
      text-decoration: none;
      font-size: 13px;
      margin: 0 12px;
      transition: color 0.2s;
    }
    
    .footer-link:hover {
      color: #F47721;
      text-decoration: underline;
    }
    
    .footer-text {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.6;
      margin: 12px 0;
    }
    
    /* Mobile Responsive */
    @media only screen and (max-width: 600px) {
      .email-wrapper {
        padding: 20px 0;
      }
      
      .email-header {
        padding: 24px 20px;
      }
      
      .email-content {
        padding: 24px 20px;
      }
      
      .email-footer {
        padding: 24px 20px;
      }
      
      .email-heading {
        font-size: 20px;
      }
      
      .button-primary {
        display: block;
        width: 100%;
      }
      
      .footer-link {
        display: block;
        margin: 8px 0;
      }
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center">
          <div class="email-container">
            
            <!-- Header -->
            <div class="email-header">
              <a href="{{frontendUrl}}" class="email-logo">LuminAID</a>
            </div>
            
            <!-- Light in Motion Accent -->
            <div class="light-accent"></div>
            
            <!-- Main Content -->
            <div class="email-content">
              
              <!-- Email Heading -->
              <h1 class="email-heading">{{emailHeading}}</h1>
              
              <!-- Main Message -->
              <p class="email-message">{{emailMessage}}</p>
              
              <!-- Dynamic Content Placeholder -->
              {{{emailBody}}}
              
            </div>
            
            <!-- Footer -->
            <div class="email-footer">
              <div class="footer-brand">LuminAID</div>
              <p class="footer-text">
                Bringing light to those who need it most
              </p>
              <div class="footer-links">
                <a href="{{frontendUrl}}" class="footer-link">Visit Website</a>
                <a href="{{frontendUrl}}/support" class="footer-link">Support</a>
                <a href="mailto:{{supportEmail}}" class="footer-link">Contact Us</a>
              </div>
              <p class="footer-text">
                LuminAID<br>
                {{currentYear}} All rights reserved
              </p>
              <p class="footer-text" style="font-size: 11px;">
                You're receiving this email because you have an account or placed an order with LuminAID.
              </p>
            </div>
            
          </div>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
